---
name: Checks

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - main
      - v14
  pull_request:

env:
  node_version: 24

jobs:
  typecheck:
    name: Type Check Code Base
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Checkout Branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.node_version }}

      - name: Cache Node.js modules
        uses: actions/cache@v5
        with:
          path: .npm
          key: ${{ runner.OS }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.OS }}-node-
            ${{ runner.OS }}-

      - run: npm ci --cache .npm --prefer-offline

      - name: Type Check
        run: npm run typecheck

      - name: Type Check (exactOptionalPropertyTypes = false)
        run: npx tsc --exactOptionalPropertyTypes false

      - name: Type Check (TS Go)
        run: npx tsgo

  lint:
    name: Lint Code Base
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Checkout Branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.node_version }}

      - name: Cache Node.js modules
        uses: actions/cache@v5
        with:
          path: .npm
          key: ${{ runner.OS }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.OS }}-node-
            ${{ runner.OS }}-

      - run: npm ci --cache .npm --prefer-offline

      - name: Run Lints
        run: npm run lint

  test:
    name: Test Code Base
    runs-on: ubuntu-latest
    # Type tests are informational: the runtime `.test.ts` suite needs a live
    # Foundry instance that CI can't provide, so a failure here must not block.
    continue-on-error: true
    permissions: {}
    steps:
      - name: Checkout Branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.node_version }}

      - name: Cache Node.js modules
        uses: actions/cache@v5
        with:
          path: .npm
          key: ${{ runner.OS }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.OS }}-node-
            ${{ runner.OS }}-

      - run: npm ci --cache .npm --prefer-offline

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Test Types
        run: npm run test-types -- --reporter default --reporter github-actions
